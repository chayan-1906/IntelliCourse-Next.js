<svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7b2cbf;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1"/>
        </linearGradient>
    </defs>
    <rect width="100" height="100" rx="20" fill="url(#grad5)"/>
    <!-- AI Neural Network -->
    <circle cx="20" cy="25" r="5" fill="#ff8500"/>
    <circle cx="40" cy="15" r="5" fill="#ff8500"/>
    <circle cx="40" cy="35" r="5" fill="#ff8500"/>
    <circle cx="60" cy="25" r="5" fill="#ff8500"/>
    <circle cx="80" cy="15" r="5" fill="#ff8500"/>
    <circle cx="80" cy="35" r="5" fill="#ff8500"/>
    <!-- Neural connections -->
    <line x1="25" y1="25" x2="35" y2="18" stroke="white" stroke-width="2"/>
    <line x1="25" y1="25" x2="35" y2="32" stroke="white" stroke-width="2"/>
    <line x1="45" y1="15" x2="55" y2="22" stroke="white" stroke-width="2"/>
    <line x1="45" y1="35" x2="55" y2="28" stroke="white" stroke-width="2"/>
    <line x1="65" y1="25" x2="75" y2="18" stroke="white" stroke-width="2"/>
    <line x1="65" y1="25" x2="75" y2="32" stroke="white" stroke-width="2"/>
    <!-- "AI" text -->
    <text x="50" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">AI</text>
    <!-- Microphone (Voice) -->
    <rect x="20" y="65" width="12" height="20" rx="6" fill="white"/>
    <rect x="23" y="85" width="6" height="6" fill="#ff8500"/>
    <!-- Graduation cap (Learning) -->
    <polygon points="70,65 60,70 70,75 80,70" fill="white"/>
    <rect x="67" y="75" width="6" height="8" fill="#ff8500"/>
    <!-- Voice waves -->
    <path d="M35 70c3 3 3 7 0 10" stroke="#ff8500" stroke-width="2" fill="none"/>
    <path d="M40 67c5 5 5 13 0 18" stroke="#ff8500" stroke-width="1.5" fill="none"/>
</svg>